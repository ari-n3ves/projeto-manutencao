<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

</head>

<body>

    <div class="container">

        <h1 class="h1">Pagamento</h1>

                Descrição Equipamento

            </div>

                Categoria

            </div>

            <div class="fiend">
                descrição do defeito
                <p class="valor">-</p>
            </div>

        </div>

        <h2 >Pagar</h2>

        <div class="fiend">
             <div class="pagamento"><h3>R$xxxxx </h3> </div>

        </div>
            
        <div class="botao">

            <div class="wrapper">
                <a href="#demo-modal2">
                    <button type="submit" class="rejeitar">cancelar</button>
                </a>
            </div>

            <div class="wrapper">
                <a href="#demo-modal">

                </a>
            </div>

        </div>

        <div id="demo-modal" class="modal">

            <div class="conteudo">

                <a href="#" class="modal_fechar">&times;</a>
                    Pagar em <br>
                    <div class="pagamento"> <h2>R$ xxxxx </h2></div><br>
               
                <a [routerLink]="['cliente/inicio']" href="#" ><button class="aprovar">Pagar</button></a> 

            </div>

        </div>

        <div id="demo-modal2" class="modal">

            <div class="conteudo">

                <a href="#" class="modal_fechar">&times;</a>

                <h2>Cancelar pagamento</h2>

                <div class="botao">

                    <a href="#" class="modal_fechar">&times;</a> 
                    <a href="#" class="cancelar"><button type="submit " class="aprovar">Cancelar</button></a> 
                    <a [routerLink]="['cliente/inicio']" href="#" class="cancelar"><button  class="aprovar">Confirmar</button></a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
