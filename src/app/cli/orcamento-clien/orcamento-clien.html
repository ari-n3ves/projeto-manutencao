<div class="container">

        <h1 class="h1">Dados da Solicitação</h1>

        <div class="meio">

            <div class="fiend">
                Descrição Equipamento: <p class="valor">{{equipamento}}</p>
            </div>

            <div class="fiend">
                Categoria: <p class="valor">{{categoria}}</p>
            </div>

            <div class="fiend">
                Defeito: <p class="valor">{{defeito}}</p>
            </div>

        </div><br>

        <h2 >Orçamento</h2>

        <div class="fiend">
             <div class="orcament"><h3>R${{valor}} </h3> </div>

        </div>
            
        <div class="botao">

            <button (click)="rejeitar()" class="cancelar">Rejeitar</button>

            <button (click)="aprovar()"  class="aprovar">Aprovar</button>


        </div>

       @if (aprovarModal) {
            <div class="modal">
                <div class="conteudo">
                    Serviço Aprovado no Valor<br>
                    <div class="orcament"> <h2>R$ {{valor}}</h2></div><br>
                    <div class="botao">
                        <button (click)="fechar()" class="cancelar">Cancelar</button>
                    
                        <button [routerLink]="['/cliente/inicio']"  class="aprovar">Confirmar</button> 
                    </div>
                </div>
            </div>

        }
        
        @if(rejeitarModal){
            <div class="modal">
                <div class="conteudo">

                    <h2>Rejeitar Serviço</h2>

                    <div class="retangulo">
                        <textarea maxlength="100"placeholder="Desescreva o motivo da sua rejeição..."></textarea>
                    </div>

                    <div class="botao">
                        <button (click)="fechar()" class="cancelar">Cancelar</button> 

                        <button [routerLink]="['/cliente/inicio']"  class="aprovar">Confirmar</button>

                    </div>

                </div>
            </div>
        
        }

</div>
