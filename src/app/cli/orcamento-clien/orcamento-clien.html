<div class="container">

        <h1 class="h1">Dados da Solicitação</h1>

        <div class="meio">

            <div class="fiend">
                Descrição Equipamento
                <p class="valor">{{equipamento}}</p>
            </div>

            <div class="fiend">
                Categoria
                <p class="valor">{{categoria}}</p>
            </div>

            <div class="fiend">
                Defeito
                <p class="valor">{{defeito}}</p>
            </div>

        </div>

        <h2 >Orçamento</h2>

        <div class="fiend">
             <div class="orcament"><h3>R${{valor}} </h3> </div>

        </div>
            
        <div class="botao">

            <button (click)="rejeitarModal" class="rejeitar">Rejeitar</button>

            <button (click)="aprovarModal" class="aprovar">Aprovar</button>


        </div>

       @if (aprovarModal) {

            <div class="conteudo">
                    Serviço Aprovado no Valor<br>
                    <div class="orcament"> <h2>R$ {{valor}}</h2></div><br>
               
                <a [routerLink]="['cliente/inicio']" href="#" title="confirmar" alt="confirmar"  class="aprovar">C</a> 

            </div>

        }
        
        @if(rejeitarModal){

            <div class="conteudo">

                <h2>Rejeitar Serviço</h2>

                <div class="retangulo">
                    <textarea maxlength="100"placeholder="Desescreva o motivo da sua rejeição..."></textarea>
                </div>

                <div class="botao">
                    <a href="#" class="cancelar"><button (click)="fechar()" class="aprovar">Cancelar</button></a> 
                    <a [routerLink]="['cliente/inicio']" href="#" title="Confirmar" alt="confirmar" class="cancelar"></a>

                </div>

            </div>

        
        }

</div>
