<div class="login-page">

  <div class="login-card">

    <div class="logo">
      <span>Fix</span>Up
    </div>

    <div class="login-header">
      <p class="welcome">BEM-VINDO</p>
      <h1>Login</h1>
    </div>

    <div class="profile-selector">

  <button
    type="button"
    class="profile-option"
    [class.active]="perfil === 'cliente'"
    (click)="selecionarPerfil('cliente')"
  >
    <div>
      <strong>Cliente</strong>
      <small>Acompanhe suas solicitações</small>
    </div>
  </button>

  <button
    type="button"
    class="profile-option"
    [class.active]="perfil === 'funcionario'"
    (click)="selecionarPerfil('funcionario')"
  >
    <div>
      <strong>Funcionário</strong>
      <small>Gerencie as manutenções</small>
    </div>
  </button>

</div>

    <form (ngSubmit)="entrar()">

      <label for="email">E-mail</label>

      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        placeholder="Digite seu e-mail"
        required
      >

      <label for="password">Senha</label>

      <input
        id="password"
        name="senha"
        type="password"
        [(ngModel)]="senha"
        placeholder="Digite sua senha"
        required
      >

      <div class="options">

        <label class="remember">
          <input type="checkbox">
          Lembrar de mim
        </label>

        <a>Esqueci minha senha</a>

      </div>

      <button class="login-button" type="submit">
        ENTRAR
      </button>

    </form>

    <p class="register" ngIf="perfil === 'cliente'">
      Ainda não possui uma conta?
      <a routerLink="/cadastro">Cadastre-se</a>
    </p>

  </div>

</div>
