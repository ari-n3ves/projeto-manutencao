<div class="cadastro-page">

  <div class="cadastro-card">

    <div class="logo">
      <span>Fix</span>Up
    </div>

    <div class="cadastro-header">
      <p class="welcome">CRIE SUA CONTA</p>

      <h1>Cadastro de cliente</h1>

      <p class="subtitle">
        Preencha seus dados para acessar o sistema
      </p>
    </div>


    <form
      #formCadastro="ngForm"
      (ngSubmit)="cadastrar()"
    >

      <div class="form-grid">

        <!-- NOME -->

        <div class="form-group full">
          <label for="nome">Nome completo</label>

          <input
            id="nome"
            name="nome"
            type="text"
            [(ngModel)]="cliente.nome"
            placeholder="Digite seu nome completo"
            minlength="2"
            required
          >
        </div>


        <!-- CPF -->

        <div class="form-group">
          <label for="cpf">CPF</label>

          <input
            id="cpf"
            name="cpf"
            type="text"
            [(ngModel)]="cliente.cpf"
            placeholder="000.000.000-00"
            required
          >
        </div>


        <!-- TELEFONE -->

        <div class="form-group">
          <label for="telefone">Telefone</label>

          <input
            id="telefone"
            name="telefone"
            type="text"
            [(ngModel)]="cliente.telefone"
            placeholder="(00) 00000-0000"
            required
          >
        </div>


        <!-- EMAIL -->

        <div class="form-group full">
          <label for="email">E-mail</label>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="cliente.email"
            placeholder="Digite seu e-mail"
            required
          >
        </div>


        <div class="section-title full">
          Endereço
        </div>


        <!-- CEP -->

        <div class="form-group">
          <label for="cep">CEP</label>

          <input
            id="cep"
            name="cep"
            type="text"
            [(ngModel)]="cliente.cep"
            placeholder="00000-000"
            required
          >
        </div>


        <!-- ESTADO -->

        <div class="form-group">
          <label for="estado">Estado</label>

          <input
            id="estado"
            name="estado"
            type="text"
            [(ngModel)]="cliente.estado"
            placeholder="PR"
            required
          >
        </div>


        <!-- RUA -->

        <div class="form-group full">
          <label for="rua">Rua</label>

          <input
            id="rua"
            name="rua"
            type="text"
            [(ngModel)]="cliente.rua"
            placeholder="Digite sua rua"
            required
          >
        </div>


        <!-- NÚMERO -->

        <div class="form-group">
          <label for="numero">Número</label>

          <input
            id="numero"
            name="numero"
            type="text"
            [(ngModel)]="cliente.numero"
            placeholder="Número"
            required
          >
        </div>


        <!-- COMPLEMENTO -->

        <div class="form-group">
          <label for="complemento">
            Complemento
            <span>(opcional)</span>
          </label>

          <input
            id="complemento"
            name="complemento"
            type="text"
            [(ngModel)]="cliente.complemento"
            placeholder="Apartamento, bloco..."
          >
        </div>


        <!-- BAIRRO -->

        <div class="form-group">
          <label for="bairro">Bairro</label>

          <input
            id="bairro"
            name="bairro"
            type="text"
            [(ngModel)]="cliente.bairro"
            placeholder="Digite seu bairro"
            required
          >
        </div>


        <!-- CIDADE -->

        <div class="form-group">
          <label for="cidade">Cidade</label>

          <input
            id="cidade"
            name="cidade"
            type="text"
            [(ngModel)]="cliente.cidade"
            placeholder="Digite sua cidade"
            required
          >
        </div>

      </div>


      <div class="info">
        Após o cadastro, sua senha será enviada para o e-mail informado.
      </div>


      <div class="actions">

        <button
          type="button"
          class="back-button"
          (click)="voltar()"
        >
          VOLTAR
        </button>

        <button
          type="submit"
          class="register-button"
        >
          CADASTRAR
        </button>

      </div>

    </form>


    <p class="login-link">
      Já possui uma conta?
      <a [routerLink]="['/login']">
        Faça login
      </a>
    </p>

  </div>

</div>
