<div class="dashboard">

  <aside class="sidebar">
    <h3 class="logo">Fix<span>Up</span></h3>

    <nav>
      <a class="active">Início</a>
      <a>Solicitações</a>
      <a>Perfil</a>
    </nav>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <span>Sistema de Manutenção</span>
      <span class="user">Cliente</span>
    </header>

    <section class="content">
      <div class="page-header">
        <div>
          <p>Bem-vindo!</p>
          <h1>Minhas solicitações</h1>
        </div>

        <button class="new-button">+ Nova solicitação</button>
      </div>

      <div class="card">
        <h2>Solicitações recentes</h2>

        <table class="table">
          <thead>
            <tr>
              <th>Data/Hora</th>
              <th>Equipamento</th>
              <th>Estado</th>
              <th>Ação</th>
            </tr>
          </thead>

          <tbody>
            @for (solicitacao of solicitacoes; track solicitacao.data) {
              <tr>
                <td>{{ solicitacao.data }}</td>
                <td>{{ solicitacao.equipamento }}</td>
                <td><span class="status">{{ solicitacao.estado }}</span></td>
                <td><button class="action-button">Visualizar</button></td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </section>

  </main>
</div>
